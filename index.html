<style>
:root{--paper:#F7F2EA;--sheet:#FFFFFF;--ink:#3B2C22;--muted:#7C7167;--rule:#E2D9CC;--accent:#A68A6D;--warn:#A5482A;--f:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:28px 22px}
main{width:100%;max-width:360px}
.word{font-weight:800;font-size:24px;letter-spacing:.3em;line-height:1}
.flipF{display:inline-block;transform:scaleX(-1);letter-spacing:0;margin-right:.3em}
.by{margin-top:5px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);font-weight:500}
.eyebrow{margin-top:54px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{font-weight:300;font-size:34px;letter-spacing:-.03em;line-height:1.1;margin:10px 0 22px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
input[type=password],input[type=text]{width:100%;padding:13px 14px;border:1px solid var(--rule);border-radius:2px;background:var(--sheet);font:500 17px var(--f);letter-spacing:.08em;color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:13px;color:var(--ink)}
.row input{width:16px;height:16px;accent-color:var(--ink);margin:0}
.row label{margin:0;font-size:13px;color:var(--ink)}
button{width:100%;padding:14px 16px;border:1px solid var(--ink);border-radius:2px;background:var(--ink);color:var(--paper);font:500 14px var(--f);cursor:pointer}
button[disabled]{opacity:.6;cursor:default}
#msg{min-height:20px;margin:10px 0 0;font-size:13px;color:var(--warn)}
.fine{margin-top:44px;padding-top:16px;border-top:1px solid var(--rule);font-size:12px;color:var(--muted)}
#gate[hidden]{display:none}
</style>
</head>
<body>
<main id="gate" hidden>
  <div class="word"><span class="flipF">F</span>LIPPED</div>
  <div class="by">by AMKAR</div>
  <div class="eyebrow">Renovation planner</div>
  <h1>Enter your access code.</h1>
  <form id="f" autocomplete="off">
    <label for="code">Access code</label>
    <input id="code" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" required>
    <div class="row"><input id="keep" type="checkbox" checked><label for="keep">Remember on this device</label></div>
    <button id="go" type="submit">Open the planner</button>
    <p id="msg" role="alert"></p>
  </form>
  <p class="fine">Need a code? Call Bathroom Flip on 0431 551 311.</p>
</main>
